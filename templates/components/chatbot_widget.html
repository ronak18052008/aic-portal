<!-- Floating Global AI Chatbot Widget (Accessible to All Roles) -->
<div x-data="floatingChatbot()" x-cloak class="fixed bottom-6 right-6 z-50 no-print">

    <!-- Chat Trigger Button (Floating Pill / Icon) -->
    <button type="button" @click="toggleChat()" 
            class="relative flex items-center gap-2.5 px-4 py-3 bg-gradient-to-r from-brand-700 to-brand-900 hover:from-brand-800 hover:to-brand-950 text-white rounded-full shadow-2xl hover:shadow-brand-500/30 transform hover:-translate-y-0.5 transition-all duration-300 border-2 border-white/20 focus:outline-none">
        <div class="relative">
            <i class="fa-solid fa-robot text-lg text-amber-300"></i>
            <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 border-2 border-brand-900 rounded-full animate-pulse"></span>
        </div>
        <span class="text-xs font-black tracking-wide pr-1">AIC Assistant</span>
        <span x-show="isOpen" class="text-xs font-bold text-slate-300 ml-1">&times;</span>
    </button>

    <!-- Floating Chat Drawer / Popup Window -->
    <div x-show="isOpen" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4 scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 scale-95"
         class="absolute bottom-16 right-0 w-[380px] sm:w-[420px] max-w-[90vw] h-[520px] bg-white rounded-3xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
        
        <!-- Drawer Header -->
        <div class="p-4 bg-gradient-to-r from-brand-800 to-brand-900 text-white flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center text-amber-300 font-bold text-sm">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h4 class="text-xs font-black tracking-wide">AIC AI Assistant</h4>
                    <p class="text-[10px] text-slate-300 font-medium">Role: <strong class="text-amber-300 uppercase">{{ current_role|default:"Scholar" }}</strong></p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <a href="/chatbot/" title="Full Page Mode" class="text-slate-300 hover:text-white text-xs p-1">
                    <i class="fa-solid fa-expand"></i>
                </a>
                <button type="button" @click="isOpen = false" class="text-slate-300 hover:text-white text-base p-1 leading-none font-bold">
                    &times;
                </button>
            </div>
        </div>

        <!-- Chat Conversation Messages -->
        <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/50" id="floating-chat-container">
            <template x-for="(msg, idx) in messages" :key="idx">
                <div class="flex gap-2" :class="{ 'justify-end': msg.isUser, 'justify-start': !msg.isUser }">
                    <template x-if="!msg.isUser">
                        <div class="w-6 h-6 rounded-full bg-brand-800 text-white flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                    </template>
                    <div class="max-w-[85%] p-3 rounded-2xl text-xs leading-relaxed"
                         :class="{ 'bg-brand-600 text-white font-medium rounded-tr-none shadow-sm': msg.isUser, 'bg-white border border-slate-200 text-slate-800 rounded-tl-none shadow-sm space-y-1': !msg.isUser }">
                        <div class="whitespace-pre-line" x-html="formatMessage(msg.text)"></div>
                    </div>
                </div>
            </template>

            <div x-show="isThinking" class="flex gap-2 items-center text-xs text-slate-400 italic">
                <div class="w-6 h-6 rounded-full bg-brand-800 text-white flex items-center justify-center text-[10px] shrink-0">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="p-2.5 bg-white rounded-xl border border-slate-200 flex items-center gap-1 shadow-sm">
                    <span class="w-1.5 h-1.5 rounded-full bg-brand-500 animate-bounce"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-brand-500 animate-bounce" style="animation-delay: 0.15s"></span>
                    <span class="w-1.5 h-1.5 rounded-full bg-brand-500 animate-bounce" style="animation-delay: 0.3s"></span>
                </div>
            </div>
        </div>

        <!-- Quick Questions Chips -->
        <div class="px-3 py-2 bg-white border-t border-slate-100 flex gap-1.5 overflow-x-auto whitespace-nowrap text-[10px]">
            <button type="button" @click="ask('How do I bridge my skill gap?')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-brand-50 text-slate-700 hover:text-brand-700 font-semibold border border-slate-200">
                Skill Gap?
            </button>
            <button type="button" @click="ask('How do I build my AI resume?')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-brand-50 text-slate-700 hover:text-brand-700 font-semibold border border-slate-200">
                AI Resume?
            </button>
            <button type="button" @click="ask('How does AIC Passport verification work?')" class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-brand-50 text-slate-700 hover:text-brand-700 font-semibold border border-slate-200">
                Passport QR?
            </button>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white border-t border-slate-200">
            <form @submit.prevent="submitMessage()" class="flex gap-1.5">
                <input type="text" x-model="input" placeholder="Type a question..." 
                       class="flex-1 px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:bg-white focus:outline-none">
                <button type="submit" :disabled="!input.trim() || isThinking" 
                        class="px-3.5 py-2 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold transition-all shadow">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

    </div>

</div>

<script>
function floatingChatbot() {
    return {
        isOpen: false,
        input: '',
        isThinking: false,
        messages: [
            {
                isUser: false,
                text: "Hi! I am your **AIC AI Copilot** (Role: {{ current_role|default:'Scholar' }}). How can I assist you?"
            }
        ],
        toggleChat() {
            this.isOpen = !this.isOpen;
            if (this.isOpen) this.scroll();
        },
        formatMessage(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" class="text-brand-600 font-bold underline hover:text-brand-800">$1</a>');
        },
        scroll() {
            setTimeout(() => {
                const el = document.getElementById('floating-chat-container');
                if (el) el.scrollTop = el.scrollHeight;
            }, 50);
        },
        ask(promptText) {
            this.input = promptText;
            this.submitMessage();
        },
        async submitMessage() {
            const q = this.input.trim();
            if (!q || this.isThinking) return;

            this.messages.push({ isUser: true, text: q });
            this.input = '';
            this.isThinking = true;
            this.scroll();

            try {
                const res = await fetch('/api/chatbot/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ message: q })
                });
                const data = await res.json();
                this.messages.push({
                    isUser: false,
                    text: data.reply || "I am processing your query."
                });
            } catch (e) {
                this.messages.push({
                    isUser: false,
                    text: "Network error. Please try again."
                });
            } finally {
                this.isThinking = false;
                this.scroll();
            }
        }
    }
}
</script>
